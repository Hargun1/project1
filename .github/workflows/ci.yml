name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch instead of paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the version used for local development, so CI failures are
          # reproducible on a developer machine.
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Generates the Prisma client from schema.prisma. No database needed:
      # `generate` is offline, unlike `migrate`.
      - name: Generate Prisma client
        run: npm run db:generate

      # This project is plain JavaScript, so there is no `tsc --noEmit` gate.
      # ESLint is the only step that parses every source file — a syntax error, an
      # undefined variable or a bad import fails here or not at all. That makes it
      # a correctness gate, not a style gate, and it must stay ahead of the tests.
      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Phase 13: the integration suite against real PostgreSQL and Redis (service
  # containers), together with the unit tests, measuring combined coverage.
  integration:
    name: Integration tests + coverage
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: collab
          POSTGRES_PASSWORD: collab_dev_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U collab" --health-interval 5s --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s
          --health-retries 12

    env:
      # The test database is created and migrated by the suite's global setup.
      INTEGRATION_DATABASE_URL: postgresql://collab:collab_dev_password@localhost:5432/collab_editor_test?schema=public
      INTEGRATION_REDIS_URL: redis://localhost:6379/15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      # Unit + integration in one run; fails below the thresholds in
      # backend/vitest.coverage.config.js.
      - name: Tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: ignore

  # Phase 12: build the production images and prove the whole stack works
  # through Nginx — the same `docker compose` a developer runs locally.
  docker:
    name: Docker images + smoke and browser tests
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      # The smoke test uses yjs and the shared workspace from node_modules.
      - name: Install dependencies
        run: npm ci

      # Throwaway secrets: the stack runs with NODE_ENV=production, which refuses
      # the "change-me" placeholders from .env.example.
      - name: Create .env
        run: |
          cp .env.example .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^JWT_REFRESH_SECRET=.*|JWT_REFRESH_SECRET=$(openssl rand -hex 32)|" .env

      - name: Build images and start the stack
        run: docker compose --profile app up -d --build --wait --wait-timeout 180

      - name: Smoke test through Nginx
        run: npm run stack:smoke

      # Phase 13: two headless Chrome users through the real UI. The runner
      # image ships Google Chrome; playwright-core drives it (no browser download).
      - name: Browser end-to-end test
        run: npm run stack:e2e

      - name: Show logs on failure
        if: failure()
        run: docker compose --profile app logs --no-color --tail=200

      - name: Stop the stack
        if: always()
        run: docker compose --profile app down -v
