name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch instead of paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the version used for local development, so CI failures are
          # reproducible on a developer machine.
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The backend and the frontend both import @collab/shared, so its
      # declaration output has to exist before anything else is type-checked.
      - name: Build shared types
        run: npm run build:shared

      # Generates the Prisma client types from schema.prisma. No database needed:
      # `generate` is offline, unlike `migrate`.
      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
