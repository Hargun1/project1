name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch instead of paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the version used for local development, so CI failures are
          # reproducible on a developer machine.
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Generates the Prisma client from schema.prisma. No database needed:
      # `generate` is offline, unlike `migrate`.
      - name: Generate Prisma client
        run: npm run db:generate

      # This project is plain JavaScript, so there is no `tsc --noEmit` gate.
      # ESLint is the only step that parses every source file — a syntax error, an
      # undefined variable or a bad import fails here or not at all. That makes it
      # a correctness gate, not a style gate, and it must stay ahead of the tests.
      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
