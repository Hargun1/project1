# Headers for the HTML page and its assets. Included per location because an
# `add_header` in a location discards all inherited ones. API responses get
# their headers from helmet in the backend instead.

# Content-Security-Policy: what the page may load and run.
#   script-src 'self'          only our own bundles: no inline scripts, no CDNs
#                              (Monaco is bundled, not loaded from a CDN, for this)
#   style-src 'unsafe-inline'  Monaco and the remote-cursor colours inject <style>
#                              elements at runtime; scripts stay strict
#   worker-src 'self'          Monaco's language workers are bundled files
#   connect-src 'self'         fetch and the WebSocket go to this origin only
#                              (CSP 3: 'self' also matches ws:/wss: on this host)
#   frame-ancestors 'none'     nobody may frame the editor (clickjacking)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Strict-Transport-Security (Phase 14): browsers must use HTTPS for this host
# for a year. $hsts is empty for localhost (see the map in nginx.conf), and
# Nginx omits a header whose value is empty. These headers are only ever
# included by the HTTPS server, so HSTS is never sent over plain HTTP.
add_header Strict-Transport-Security $hsts always;
