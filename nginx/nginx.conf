# Nginx (Phase 12, spec §35): the single public entry point.
#
#   /            built React app (static files, SPA fallback to index.html)
#   /assets/     hashed bundles, cached for a year
#   /api/        reverse proxy → backend instances (load balanced)
#   /ws          WebSocket upgrade → backend instances
#   /healthz     liveness of *a* backend instance, not access-logged
#   /readyz      readiness of *a* backend instance, not access-logged
#
# The browser only ever talks to this origin, so CORS is never involved and
# the refresh cookie (Path=/api/auth) is first-party.

worker_processes auto;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;          # no version number in headers or error pages
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;

  # ── Logging ───────────────────────────────────────────────────────────────
  # One JSON object per line, like the backend's pino logs. `$uri` (not
  # `$request_uri`) leaves out the query string, which for /ws carries the
  # single-use ticket. `upstream` names the backend instance that served the
  # request; `request_id` is also sent to the backend (X-Request-Id), so one id
  # links this line to the backend's log line.
  log_format json escape=json
    '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"request_time":$request_time,"upstream":"$upstream_addr",'
    '"upstream_status":"$upstream_status","upstream_time":"$upstream_response_time"}';
  access_log /var/log/nginx/access.log json;   # symlinked to stdout in the image
  error_log /var/log/nginx/error.log warn;     # symlinked to stderr

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # ── Coarse flood control ──────────────────────────────────────────────────
  # A first, cheap layer that never reaches Node. Deliberately generous: the
  # precise, user- and email-aware limits live in the backend (Redis, Phase 11).
  limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;
  limit_conn_zone $binary_remote_addr zone=ws_per_ip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  # `Connection: upgrade` only when the client asked for an upgrade.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ── Load balancing ────────────────────────────────────────────────────────
  # Docker's embedded DNS. With `resolve` below, Nginx re-resolves the names
  # every 5 s: a stopped container drops out of DNS and of the upstream, a
  # restarted one (often with a new IP) is found again, and Nginx starts even if
  # a backend is not up yet. Until a restart is noticed, requests may get 503.
  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream backend {
    zone backend 64k;          # shared memory, required by `resolve`
    # least_conn, not round-robin: WebSockets live for hours, so "fewest open
    # connections" balances real load better than "next in line".
    least_conn;
    # Passive health checks (open-source Nginx has no active probes): after 3
    # failed attempts an instance is skipped for 10 s, then tried again.
    server backend-1:4000 resolve max_fails=3 fail_timeout=10s;
    server backend-2:4000 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;              # reuse TCP connections to the backends
  }

  server {
    listen 80;
    server_name _;

    # The backend caps JSON bodies at 100 KB and answers with its own JSON 413;
    # this only stops absurd uploads before they are read.
    client_max_body_size 1m;

    root /usr/share/nginx/html;

    # Inside the Docker network a backend connects in well under a millisecond.
    # A stopped container's IP answers nothing at all (no refusal), so without a
    # short limit Nginx would wait the 60 s default before trying the next
    # instance; WebSocket reconnects after a failover took that long. Applies to
    # every proxied location; `proxy_next_upstream` then retries elsewhere.
    proxy_connect_timeout 3s;

    # ── API ─────────────────────────────────────────────────────────────────
    location /api/ {
      limit_req zone=api_per_ip burst=60 nodelay;
      include /etc/nginx/snippets/proxy-headers.conf;
      proxy_set_header Connection "";        # keep-alive to the upstream
      proxy_pass http://backend;
      # Nginx retries another instance only for errors before a response, and
      # never for POST/PATCH/DELETE (not idempotent), its default since 1.9.13.
      proxy_next_upstream error timeout;
      proxy_read_timeout 30s;
      error_page 502 503 504 = @service_unavailable;
      error_page 429 = @rate_limited;
    }

    # ── WebSocket ───────────────────────────────────────────────────────────
    location = /ws {
      limit_conn ws_per_ip 50;
      include /etc/nginx/snippets/proxy-headers.conf;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://backend;
      # The backend pings every 30 s, so a healthy socket is never idle this
      # long; a dead one is cut after 2 minutes. Nginx's 60 s default would be
      # cutting live sockets as soon as the heartbeat interval was raised.
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }

    # ── Health ──────────────────────────────────────────────────────────────
    # Probes fire every few seconds; logging them would bury real traffic.
    location ~ ^/(healthz|readyz)$ {
      access_log off;
      include /etc/nginx/snippets/proxy-headers.conf;
      proxy_set_header Connection "";
      proxy_pass http://backend;
    }

    # Nginx's own liveness, for the container healthcheck. Never proxied.
    location = /nginx-health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # ── Static files ────────────────────────────────────────────────────────
    # Vite puts a content hash in every file name under /assets/, so a file
    # never changes: browsers may cache it for a year.
    location /assets/ {
      include /etc/nginx/snippets/security-headers.conf;
      expires 1y;
      try_files $uri =404;
    }

    # Everything else is a client-side route (/documents/:id, /login, ...):
    # serve index.html and let React Router decide. index.html itself must be
    # revalidated, so a deploy is picked up on the next load.
    location / {
      include /etc/nginx/snippets/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri /index.html;
    }

    # ── Errors Nginx produces itself, in the API's JSON envelope ────────────
    # The frontend parses `{ error: { code, message } }`; an HTML error page
    # from Nginx would surface as a meaningless "status 502".
    location @service_unavailable {
      default_type application/json;
      add_header Retry-After 5 always;
      return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"The service is temporarily unavailable. Please try again in a moment."}}';
    }

    location @rate_limited {
      default_type application/json;
      add_header Retry-After 1 always;
      return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests. Please slow down."}}';
    }
  }
}
