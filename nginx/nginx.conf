# Nginx (Phase 12, spec §35; HTTPS added in Phase 14): the single public entry
# point. Port 80 only redirects to HTTPS; port 443 serves the app, whose
# routes are in snippets/app-locations.conf.
#
# The browser only ever talks to this origin, so CORS is never involved and
# the refresh cookie (Path=/api/auth) is first-party.

worker_processes auto;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;          # no version number in headers or error pages
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;

  # ── Logging ───────────────────────────────────────────────────────────────
  # One JSON object per line, like the backend's pino logs. `$uri` (not
  # `$request_uri`) leaves out the query string, which for /ws carries the
  # single-use ticket. `upstream` names the backend instance that served the
  # request; `request_id` is also sent to the backend (X-Request-Id), so one id
  # links this line to the backend's log line.
  log_format json escape=json
    '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"request_time":$request_time,"upstream":"$upstream_addr",'
    '"upstream_status":"$upstream_status","upstream_time":"$upstream_response_time"}';
  access_log /var/log/nginx/access.log json;   # symlinked to stdout in the image
  error_log /var/log/nginx/error.log warn;     # symlinked to stderr

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # ── Coarse flood control ──────────────────────────────────────────────────
  # A first, cheap layer that never reaches Node. Deliberately generous: the
  # precise, user- and email-aware limits live in the backend (Redis, Phase 11).
  limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;
  limit_conn_zone $binary_remote_addr zone=ws_per_ip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  # Strict-Transport-Security tells browsers to use HTTPS for this host name,
  # on every port, for a year. Never for localhost: it would force HTTPS on all
  # the other projects a developer runs on localhost. An empty value means
  # Nginx sends no header at all (security-headers.conf).
  map $host $hsts {
    localhost  "";
    127.0.0.1  "";
    default    "max-age=31536000";
  }

  # `Connection: upgrade` only when the client asked for an upgrade.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ── Load balancing ────────────────────────────────────────────────────────
  # Docker's embedded DNS. With `resolve` below, Nginx re-resolves the names
  # every 5 s: a stopped container drops out of DNS and of the upstream, a
  # restarted one (often with a new IP) is found again, and Nginx starts even if
  # a backend is not up yet. Until a restart is noticed, requests may get 503.
  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream backend {
    zone backend 64k;          # shared memory, required by `resolve`
    # least_conn, not round-robin: WebSockets live for hours, so "fewest open
    # connections" balances real load better than "next in line".
    least_conn;
    # Passive health checks (open-source Nginx has no active probes): after 3
    # failed attempts an instance is skipped for 10 s, then tried again.
    # One name for every replica: Docker's DNS answers `backend` with the
    # address of each running container, and `resolve` turns each address into
    # a server here. `docker compose up --scale backend=3` therefore needs no
    # change to this file (Phase 14).
    server backend:4000 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;              # reuse TCP connections to the backends
  }

  # ── Port 80: only the redirect (and certificate renewal) ──────────────────
  server {
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 challenges (certbot --webroot) must work over plain
    # HTTP, before a certificate exists.
    location /.well-known/acme-challenge/ {
      root /var/www/acme;
    }

    location = /nginx-health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Everything else moves to HTTPS. Written at start-up by
    # docker-entrypoint.d/40-tls.sh, because the public HTTPS port (8443 locally,
    # 443 in production) is configuration, and Nginx cannot read environment
    # variables itself.
    location / {
      include /etc/nginx/snippets/https-redirect.conf;
    }
  }

  # ── Port 443: the app ─────────────────────────────────────────────────────
  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # A real certificate when one is mounted (Let's Encrypt in production,
    # mkcert locally), otherwise a self-signed one made at start-up: see
    # docker-entrypoint.d/40-tls.sh.
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;   # modern clients pick well; Mozilla "intermediate"
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/app-locations.conf;
  }
}
