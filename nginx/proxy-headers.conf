# Included by every proxied location. (A `proxy_set_header` inside a location
# replaces *all* inherited ones, so they are kept in one file instead.)

proxy_http_version 1.1;

# The host the browser used, for redirects and logging.
proxy_set_header Host $host;

# Appends the address Nginx saw to whatever the client sent. The backend trusts
# exactly one hop (TRUST_PROXY_HOPS=1), i.e. the entry Nginx appended, so a
# client-supplied X-Forwarded-For cannot change its rate-limit identity.
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Nginx's own id, always (never the client's): the backend reuses it, so both
# log lines carry the same request_id.
proxy_set_header X-Request-Id $request_id;
