# Two ways to run the project:
#
#   docker compose up -d                       PostgreSQL + Redis only. The app runs
#   (npm run infra:up)                         on the host with hot reload
#                                              (npm run dev:backend / dev:frontend).
#
#   docker compose --profile app up -d --build The whole system in containers:
#   (npm run stack:up)                         Nginx serving the frontend over HTTPS
#                                              (https://localhost:8443; :8080
#                                              redirects) and load-balancing the
#                                              backend replicas, linked by Redis
#                                              Pub/Sub, after a one-shot migration.
#
#        browser ──► nginx :8443 ──► backend × N ─┬─► redis (Pub/Sub, sessions, limits)
#                       (static)     (default 2)  └─► postgres (documents, revisions)
#
# Scaling (Phase 14): `docker compose --profile app up -d --scale backend=3`.
# Nginx finds every replica through Docker's DNS; nothing else changes.
#
# Every value comes from the root .env; nothing secret is written here. The
# stack runs the production images with NODE_ENV=production, so the backend
# refuses to start while JWT_SECRET / JWT_REFRESH_SECRET hold the "change-me"
# placeholders from .env.example (see README → "Run the whole stack in Docker").
# docker-compose.prod.yml adapts this file to a real server (docs/aws.md).

name: collab-editor

services:
  postgres:
    image: postgres:17-alpine
    container_name: collab-editor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-collab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collab_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-collab_editor}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-collab} -d ${POSTGRES_DB:-collab_editor}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: collab-editor-redis
    restart: unless-stopped
    # Persistence is intentionally off: Redis holds Pub/Sub traffic, rate-limit
    # counters, refresh sessions and WS tickets — never durable document state.
    command: ['redis-server', '--appendonly', 'no', '--save', '']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  # Applies pending Prisma migrations once, then exits. Every backend replica
  # waits for it to *succeed*, so no instance ever runs against an old schema,
  # and replicas never race to migrate the same database.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: build
    image: collab-editor-migrate
    profiles: [app]
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-collab}:${POSTGRES_PASSWORD:-collab_dev_password}@postgres:5432/${POSTGRES_DB:-collab_editor}?schema=public
    command: ['npm', 'run', 'db:deploy', '--workspace', '@collab/backend']
    depends_on:
      postgres:
        condition: service_healthy

  # The app instances. One service, N identical replicas: any replica can serve
  # any document (edits travel over Redis, state lives in PostgreSQL), so the
  # count is a deployment choice, not an architecture change.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    image: collab-editor-backend
    profiles: [app]
    deploy:
      replicas: ${BACKEND_REPLICAS:-2}
    restart: unless-stopped
    # Tini as PID 1: forwards SIGTERM to Node and reaps zombies.
    init: true
    # server.js gives itself 10 s to close sockets and flush documents.
    stop_grace_period: 15s
    # Tuning knobs (rate limits, TTLs, secrets) come from .env ...
    env_file:
      - path: .env
        required: false
    # ... and these replace the host-development values for the container network.
    environment:
      NODE_ENV: production
      PORT: 4000
      LOG_LEVEL: ${STACK_LOG_LEVEL:-info}
      # The browser's origin: used for CORS, the CSRF Origin check and the
      # WebSocket Origin check. Must match the address in the address bar.
      CLIENT_URL: ${STACK_CLIENT_URL:-https://localhost:8443}
      DATABASE_URL: postgresql://${POSTGRES_USER:-collab}:${POSTGRES_PASSWORD:-collab_dev_password}@postgres:5432/${POSTGRES_DB:-collab_editor}?schema=public
      REDIS_URL: redis://redis:6379
      # Exactly one proxy (Nginx) in front.
      TRUST_PROXY_HOPS: 1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Not published: the only way in is through Nginx.
    expose:
      - '4000'

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: collab-editor-web
    profiles: [app]
    restart: unless-stopped
    ports:
      - '${STACK_HTTP_PORT:-8080}:80'
      - '${STACK_HTTPS_PORT:-8443}:443'
    environment:
      # Where port 80 redirects to; must match the published HTTPS port.
      PUBLIC_HTTPS_PORT: ${STACK_HTTPS_PORT:-8443}
    volumes:
      # Optional real certificate (fullchain.pem + privkey.pem, e.g. from
      # mkcert). An empty folder means a self-signed certificate is generated.
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
